# Generate the Xcode project with:  cd ios && xcodegen
name: Cook99
options:
  bundleIdPrefix: com.j0qnn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Cook99:
    type: application
    platform: iOS
    sources:
      - path: Cook99
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.j0qnn.cook99
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cook99
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Bundle the web app
        basedOnDependencyAnalysis: false
        script: |
          # The app ships the same files as the web version, copied fresh on every build from the folder above.
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Web"
          mkdir -p "$DEST"
          rsync -a --delete --exclude ios --exclude tests --exclude server.mjs --exclude package.json --exclude README.md \
            --exclude .nojekyll --exclude sw.js --exclude '.*' "${SRCROOT}/../" "$DEST/"
